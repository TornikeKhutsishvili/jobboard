<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    {% include 'components/meta-tags.html' %}

    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- main css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />

    <!-- title -->
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    <!-- header -->{% include 'layouts/header.html' %}<!-- end header -->
    <!-- flash message -->{% include 'components/flash-messages.html' %}
    <!-- main content -->
      <main class="container my-5">{% block content %}{% endblock %}</main>
    <!-- end main content -->
    <!-- footer -->{% include 'layouts/footer.html' %}<!-- end footer -->

    <!-- scripts -->
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    <!-- bootstrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
