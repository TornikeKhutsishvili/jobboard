{% extends 'base.html' %}
{% block title %} {{ title }} {% endblock %}

{% block content %}
<section class="error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-accent" href="{{ url_for('index') }}">
    <i class="bi bi-arrow-left"></i> ვაკანსიებზე დაბრუნება
  </a>
</section>
{% endblock %}
